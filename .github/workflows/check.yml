name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r server/requirements.lock.txt
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build and run offline checks
        run: python scripts/check-release.py
