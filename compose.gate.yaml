services:
  frontend:
    image: ${WORKBENCH_IMAGE:-ghcr.io/kronosxup/nai-workbench:beta}
    ports:
      - "${WORKBENCH_BIND:-127.0.0.1}:${WORKBENCH_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKBENCH_GATE_URL: ${WORKBENCH_GATE_URL:?Set the internal Gate URL}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
